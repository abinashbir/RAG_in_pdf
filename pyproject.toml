[project]
name = "rag-in-pdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abinashbir", email = "abinashbir13112@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asttokens>=3.0.2",
    "comm>=0.2.3",
    "deepagents>=0.7.6",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.4",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langchain[openai]>=1.3.15",
    "numpy>=2.5.2",
    "pypdf>=6.16.1",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
rag-in-pdf = "rag_in_pdf:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
